<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>beds24-direct-booking</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- With an anchor, the page stays hidden until the script at its end has moved it there:
         a transfer that stalls after the hero would otherwise paint the hero first. Without
         one, there is no first jump to keep from being animated, so jumps are smooth at once. -->
    <script>
      document.documentElement.setAttribute(location.hash ? 'data-jump' : 'data-smooth', '');
    </script>
    <style>
      html[data-jump] body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <!-- Chromium jumps to an address's anchor only once the application's scripts have run, so
         the page would first be painted at its top. This places it at the first paint, with the
         header's ground, which it has below the top. -->
    <script>
      if (location.hash) {
        let target = null;
        try {
          target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        } catch {} // A fragment such as "#50%" cannot be decoded and names no section.
        target?.scrollIntoView();
        if (scrollY > 0) document.querySelector('app-header')?.removeAttribute('data-over');
        // A jump the visitor asks for before the application starts is smooth all the same.
        addEventListener('click', () => document.documentElement.setAttribute('data-smooth', ''), {
          capture: true,
          once: true,
        });
      }
      // Also when the fragment was cleared while the page loaded.
      document.documentElement.removeAttribute('data-jump');
    </script>
  </body>
</html>
