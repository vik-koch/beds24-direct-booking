<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>beds24-direct-booking</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
    <!-- Chromium jumps to an address's anchor only once the application's scripts have run, so
         the page would first be painted at its top. This places it at the first paint, with the
         header's ground, which it has below the top. -->
    <script>
      if (location.hash) {
        document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
        if (scrollY > 0) document.querySelector('app-header')?.removeAttribute('data-over');
      }
    </script>
  </body>
</html>
