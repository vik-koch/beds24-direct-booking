name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time, so two deployments never overlap. The order of waiting runs is
# not guaranteed: the deploy job checks for itself that its commit is still the head of main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but documentation changed. A push to main always counts, as it deploys.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE...HEAD" | grep -qvE '^docs/|\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Saved straight after npm ci, before the build keeps its pictures inside node_modules
      # (ADR 10): a changed picture behind the same address would be served old. package.json
      # is in the key, so a lock file that does not match it still reaches npm ci and fails.
      - id: modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-static-node24-${{ hashFiles('package.json', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  # The suite in three parts on runners of their own, as one runner takes no more than two
  # workers (ADR 12). Not for documentation alone, which format, lint and unit tests check.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The browsers and their system packages come with the image (ADR 9). Firefox refuses to run
    # as root in another user's home, so the job runs as the runner's user.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: modules
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: modules-playwright-node24-${{ hashFiles('package.json', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Check that the image's browsers belong to the installed Playwright
        run: |
          image=$(grep -oP 'playwright:v\K[0-9.]+' .github/workflows/ci.yml)
          package=$(node -p "require('@playwright/test/package.json').version")
          if [ "$image" != "$package" ]; then
            echo "::error::the Playwright image is $image, @playwright/test is $package; change the image's tag in ci.yml"
            exit 1
          fi
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report

  # One result for the jobs before the images, whatever their layout.
  check:
    needs: [changes, static, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.e2e.result }}" = success || {
            test "${{ needs.changes.result }}" = success && test "${{ needs.e2e.result }}" = skipped
          }

  stack:
    # On ARM, the architecture the pushed images are not built for, so both stay buildable.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-stack.sh

  # From here on only for a merge to main: the images of this commit, then the demo.
  images:
    if: github.event_name == 'push'
    needs: [check, stack]
    # The runner's architecture is the images': x64, as the demo machine.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in web sim; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$name:sha-$GITHUB_SHA"
            docker build -t "$image" "$([ "$name" = web ] && echo . || echo sim)"
            docker push "$image"
          done

  deploy:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ vars.DEMO_APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          APP_DOMAIN: ${{ vars.DEMO_APP_DOMAIN }}
        run: |
          : "${DEPLOY_HOST:?variable DEPLOY_HOST is not set}"
          : "${DEPLOY_KNOWN_HOSTS:?variable DEPLOY_KNOWN_HOSTS is not set}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?secret DEPLOY_SSH_PRIVATE_KEY is not set}"
          : "${APP_DOMAIN:?variable DEMO_APP_DOMAIN is not set}"
          # An older commit must not replace a newer one: a slow or repeated run stops here.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now, so $GITHUB_SHA is not deployed"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > "$RUNNER_TEMP/demo.env" <<EOF
          STACK_NAME=beds24-demo
          APP_DOMAIN=$APP_DOMAIN
          WEB_IMAGE=$image-web:sha-$GITHUB_SHA
          SIM_IMAGE=$image-sim:sha-$GITHUB_SHA
          COMPOSE_PROFILES=sim
          BEDS24_URL=http://sim:4300/v2
          BEDS24_TOKEN=simulator
          EOF
          SSH_OPTS="-i $RUNNER_TEMP/key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10" \
            scripts/deploy.sh "$DEPLOY_HOST" "$RUNNER_TEMP/demo.env"
