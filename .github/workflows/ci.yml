name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time, so two deployments never overlap. The order of waiting runs is
# not guaranteed: the deploy job checks for itself that its commit is still the head of main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  stack:
    # On ARM, the architecture the pushed images are not built for, so both stay buildable.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-stack.sh

  # From here on only for a merge to main: the images of this commit, then the demo.
  images:
    if: github.event_name == 'push'
    needs: [check, stack]
    # The runner's architecture is the images': x64, as the demo machine.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in web sim; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$name:sha-$GITHUB_SHA"
            docker build -t "$image" "$([ "$name" = web ] && echo . || echo sim)"
            docker push "$image"
          done

  deploy:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ vars.DEMO_APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          APP_DOMAIN: ${{ vars.DEMO_APP_DOMAIN }}
        run: |
          : "${DEPLOY_HOST:?variable DEPLOY_HOST is not set}"
          : "${DEPLOY_KNOWN_HOSTS:?variable DEPLOY_KNOWN_HOSTS is not set}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?secret DEPLOY_SSH_PRIVATE_KEY is not set}"
          : "${APP_DOMAIN:?variable DEMO_APP_DOMAIN is not set}"
          # An older commit must not replace a newer one: a slow or repeated run stops here.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now, so $GITHUB_SHA is not deployed"
            exit 0
          fi
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > "$RUNNER_TEMP/demo.env" <<EOF
          STACK_NAME=beds24-demo
          APP_DOMAIN=$APP_DOMAIN
          WEB_IMAGE=$image-web:sha-$GITHUB_SHA
          SIM_IMAGE=$image-sim:sha-$GITHUB_SHA
          COMPOSE_PROFILES=sim
          BEDS24_URL=http://sim:4300/v2
          BEDS24_TOKEN=simulator
          EOF
          SSH_OPTS="-i $RUNNER_TEMP/key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=10" \
            scripts/deploy.sh "$DEPLOY_HOST" "$RUNNER_TEMP/demo.env"
